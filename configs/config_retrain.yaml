# Retrain on the data you ALREADY generated (data/processed, M=4, top_k 3): no new retrieval, no new generation.
# Changes vs config.yaml: lower KL weight + longer warm-up, 10 epochs, 2x more optimizer steps (grad_accum 2),
# latent path 5x the (lower) encoder learning rate, small unit-RMS latent key/value, LayerNorm on encoder features.
# v2: the first version of this config diverged (KL in the tens of thousands); lr lowered and stabilisers added.
# Phase 1 configuration: diverse grounded RAG with a latent-variable (CVAE) module.
# Edit values here, not in the scripts.

seed: 42

paths:
  # Folders searched (recursively) for the LegalBench-RAG "corpus" and "benchmarks" folders.
  data_root_candidates: ["data/raw", "/kaggle/input", "/kaggle/working/data/raw"]
  processed_dir: "data/processed"
  output_dir: "outputs_retrain"

data:
  dataset_name: "cuad"              # picks benchmark files whose name contains this
  max_train_queries: 300            # keep small so everything finishes today
  max_val_queries: 40
  max_test_queries: 40
  restrict_corpus_to_query_docs: true   # index only the contracts used by the selected queries (faster)

retrieval:
  embedding_model: "BAAI/bge-small-en-v1.5"
  chunk_size: 512                   # characters
  chunk_overlap: 50
  top_k: 3

model:
  backbone: "meta-llama/Llama-3.2-1B-Instruct"   # gated: needs HF_TOKEN
  latent_dim: 32                    # paper: Dim = 32
  num_query_tokens: 4               # paper: four-token latent query
  encoder_layers: 2                 # paper: embedding + first two transformer layers of the backbone
  adapter_norm: true        # our addition: unit-RMS latent key/value (see model.py)
  adapter_gain_init: 0.1          # start size of the latent key/value when adapter_norm is on
  mu_bound: 5.0            # bound on the posterior mean (our stabiliser); 0 = off
  feature_norm: true           # stabiliser: LayerNorm on the encoder features
  adapter_hidden: 256               # hidden size of the per-layer latent adapter MLPs
  max_prompt_tokens: 640
  max_response_tokens: 180

# Self-supervised training data: the backbone writes M responses per question (as in the paper,
# which samples responses from the backbone itself). Style hints are used ONLY while writing
# the data; the training prompt does not contain them, so z has to learn the variation.
generation_data:
  styles: ["plain", "technical", "concise", "cautious"]   # M = number of styles
  temperature: 0.9
  top_p: 0.95
  max_new_tokens: 160
  batch_size: 8
  min_words: 5

training:
  epochs: 10
  lr: 2.0e-5
  weight_decay: 0.01
  latent_lr_mult: 5.0           # learning-rate multiplier for adapter + G-Skip FFN
  kl_weight: 0.5
  kl_warmup_steps: 100              # beta ramps 0 -> kl_weight (extra safeguard against collapse)
  grad_accum: 2                     # questions per optimizer step (each question = a group of M responses)
  grad_clip: 1.0
  kl_abort: 500                     # stop early if KL(inst) stays above this (divergence guard)
  fp16: true
  use_wandb: false
  log_every: 10

eval:
  num_samples: 4                    # diverse answers per test question
  temperature: 1.0
  top_p: 0.95
  max_new_tokens: 160
